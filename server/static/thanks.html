<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Focus Coach</title>
  <style>
    :root { color-scheme: dark; }
    body {
      margin: 0; min-height: 100vh; display: grid; place-items: center;
      background: #0d1117; color: #e8edf3; text-align: center; padding: 24px;
      font: 15px/1.6 -apple-system, BlinkMacSystemFont, "Segoe UI", system-ui, sans-serif;
    }
    .card { max-width: 420px; }
    .mark {
      width: 62px; height: 62px; margin: 0 auto 22px; border-radius: 50%;
      border: 3px solid #22C55E; display: grid; place-items: center;
      font-size: 30px; color: #22C55E;
    }
    h1 { font-size: 22px; margin: 0 0 10px; }
    p { color: #7c8a99; margin: 0 0 8px; }
    .cancelled .mark { border-color: #7c8a99; color: #7c8a99; }
  </style>
</head>
<body>
  <div class="card" id="card">
    <div class="mark" id="mark">✓</div>
    <h1 id="title">You're on Pro</h1>
    <p id="body">Open the Focus Coach popup — it'll pick up the change within a few seconds.</p>
    <p>You can close this tab.</p>
  </div>
  <script>
    // One page serves both outcomes so there's only one URL to configure.
    if (new URLSearchParams(location.search).has("cancelled")) {
      document.getElementById("card").className = "card cancelled";
      document.getElementById("mark").textContent = "–";
      document.getElementById("title").textContent = "Checkout cancelled";
      document.getElementById("body").textContent =
        "Nothing was charged. Your free plan is untouched.";
    }
  </script>
</body>
</html>
