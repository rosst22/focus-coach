<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <title>Focus Coach</title>
    <link rel="stylesheet" href="popup.css" />
  </head>
  <body>
    <header>
      <span class="dot" id="dot"></span>
      <h1>Focus Coach</h1>
      <span class="verdict" id="verdict"></span>
    </header>

    <section class="pad">
      <label for="goal">What are you working on?</label>
      <input id="goal" type="text" placeholder="e.g. STAB22 problem set 3" />
      <button id="toggle" class="primary wide">Start session</button>
    </section>

    <section class="stats" id="stats">
      <div><b id="statFocus">0m</b><span>focused</span></div>
      <div><b id="statDrift">0m</b><span>drifted</span></div>
      <div><b id="statStreak">0m</b><span>streak</span></div>
    </section>

    <section class="pad">
      <label for="taskInput">Tasks — tick one to get cheered on</label>
      <div class="row">
        <input id="taskInput" type="text" placeholder="Add a task and press Enter" />
      </div>
      <ul id="tasks"></ul>
    </section>

    <details class="pad">
      <summary>Settings</summary>

      <div id="account">
        <div id="signedOut">
          <label for="email">Sign in — no password, no API key</label>
          <input id="email" type="email" placeholder="you@example.com" />
          <button id="sendCode" class="ghost wide">Email me a code</button>

          <div id="codeBox" class="nested" style="display:none">
            <label for="code">6-digit code</label>
            <input id="code" type="text" inputmode="numeric" maxlength="6" placeholder="000000" />
            <button id="verifyCode" class="primary wide">Sign in</button>
          </div>
          <p class="note" id="authNote"></p>
        </div>

        <div id="signedIn" style="display:none">
          <div class="acct">
            <div>
              <b id="acctEmail"></b>
              <div class="note" id="acctUsage"></div>
            </div>
            <span class="pill" id="acctPlan">free</span>
          </div>
          <button id="upgrade" class="primary wide">Upgrade to Pro</button>
          <button id="signOut" class="ghost wide">Sign out</button>
        </div>
      </div>

      <label class="check">
        <input type="checkbox" id="smartMode" />
        Smart mode — let Claude read the page and write the line
      </label>

      <label class="check">
        <input type="checkbox" id="useScreenshots" />
        Send a screenshot of the tab <span class="pro">Pro</span>
      </label>

      <label for="tone">Coach tone</label>
      <select id="tone">
        <option value="hype">Hype — loud and enthusiastic</option>
        <option value="calm">Calm — quiet and kind</option>
        <option value="coach">Coach — blunt, no fluff</option>
      </select>

      <label for="focusSites">Always focus (one per line)</label>
      <textarea id="focusSites" rows="3" placeholder="q.utoronto.ca&#10;github.com"></textarea>

      <label for="distractSites">Always distraction (one per line)</label>
      <textarea id="distractSites" rows="3" placeholder="youtube.com&#10;reddit.com"></textarea>

      <details class="sub">
        <summary>Advanced — use my own Anthropic key</summary>
        <label class="check">
          <input type="checkbox" id="keyMode" />
          Bill my own Anthropic account instead of signing in
        </label>
        <div id="ownKeyBox" class="nested">
          <label for="apiKey">Anthropic API key</label>
          <input id="apiKey" type="password" placeholder="sk-ant-..." />
          <label for="model">Model</label>
          <select id="model">
            <option value="claude-opus-5">Opus 5 — sharpest</option>
            <option value="claude-sonnet-5">Sonnet 5 — cheaper</option>
            <option value="claude-haiku-4-5">Haiku 4.5 — cheapest</option>
          </select>
          <button id="testKey" class="ghost wide">Test the key</button>
          <p class="note" id="testResult"></p>
        </div>
        <label for="apiBase">API server</label>
        <input id="apiBase" type="text" placeholder="https://api.focuscoach.app" />
      </details>

      <button id="save" class="ghost wide">Save settings</button>
    </details>

    <footer id="footer"></footer>
    <script src="popup.js"></script>
  </body>
</html>
